name: au_dmg
channels:
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.22
  - matplotlib
  - pip
  - pip:
    - gymnasium
    - pytest
    - d4rl # optional, install if running D4RL benchmarks
    # torch must be installed from https://pytorch.org matching your CUDA
    # e.g., pip install torch --index-url https://download.pytorch.org/whl/cpu
