name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.10]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r paperAssignments/Assignments1-50/CA9/requirements.txt
      - name: Run tests
        working-directory: paperAssignments/Assignments1-50/CA9
        run: |
          python -m pytest tests -q
