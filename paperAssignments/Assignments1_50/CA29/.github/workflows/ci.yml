name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run fast tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: paperAssignments/Assignments1-50/CA29
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pyyaml gymnasium matplotlib pandas
          # Install CPU-only PyTorch wheel (fastest common option)
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests (fast)
        working-directory: paperAssignments/Assignments1-50/CA29
        env:
          # Ensure smoke tests are skipped by default in CI
          RUN_SMOKE: '0'
        run: |
          pytest -q
