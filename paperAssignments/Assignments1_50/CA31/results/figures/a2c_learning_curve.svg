<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(50,350)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#333"/>
    <line x1="0" y1="0" x2="0" y2="-300" stroke="#333"/>
    <!-- axis labels -->
    <text x="350" y="30" text-anchor="middle" font-family="sans-serif">Environment steps</text>
    <text x="-40" y="-150" transform="rotate(-90 -40,-150)" font-family="sans-serif">Episode reward</text>
    <!-- simple curve -->
    <polyline fill="none" stroke="#1f77b4" stroke-width="3" points="0,-20 50,-25 100,-30 150,-40 200,-60 250,-90 300,-120 350,-145 400,-170 450,-190 500,-220 550,-240 600,-255 650,-270 700,-280"/>
    <!-- placeholder legend -->
    <rect x="520" y="-290" width="170" height="45" fill="#f8f8f8" stroke="#ddd"/>
    <line x1="530" y1="-270" x2="560" y2="-270" stroke="#1f77b4" stroke-width="3"/>
    <text x="570" y="-264" font-family="sans-serif">A2C (placeholder)</text>
