# MAMBA-PEAC configuration skeleton
morph:
  latent_dim: 16
  history_len: 50
  contrastive: true
  beta_m: 0.5
  free_bits: 1.0
world_model:
  latent_dim: 64
  beta_z: 1.0
  free_bits: 1.0
  lr: 3e-4
actor:
  lr: 3e-4
  entropy: 0.01
value:
  lr: 3e-4
train:
  batch_size: 64
  horizon: 15
  grad_clip: 40
  updates_per_env: 2



