# MA-EZV2 default configuration (small/sanity settings)
model:
  obs_dim: 24
  latent_dim: 128
  joint_action_dim: 16
  per_agent_action_dims: [4, 4]

training:
  batch_size: 32
  lr: 1e-3
  unroll_steps: 5
  gamma: 0.99
  epochs: 2

search:
  gumbel_on: true
  topk: 8
  factored_search: true

loss_weights:
  pi: 1.0
  v: 1.0
  r: 1.0
  z: 0.5













