maml:
  obs_dim: 4
  action_dim: 2
  hidden_dim: 64
  inner_lr: 0.1
  meta_lr: 0.001
  inner_steps: 1
  gamma: 0.99
  num_meta_iterations: 50
  meta_batch_size: 5
  num_steps_per_task: 50

rl2:
  obs_dim: 4
  action_dim: 2
  hidden_dim: 256
  num_lstm_layers: 2
  lr: 0.001
  gamma: 0.99
  lam: 0.95
  num_meta_iterations: 30
  meta_batch_size: 3
  num_episodes_per_task: 5
  ppo_epochs: 4
  clip_ratio: 0.2

task:
  env_name: "CartPole-v1"
  num_tasks: 20
  gravity_range: [8.0, 11.0]
  masscart_range: [0.8, 1.2]
  masspole_range: [0.08, 0.12]
  length_range: [0.4, 0.6]

experiment:
  algorithm: "maml"  # or "rl2"
  seed: 42
  save_path: "results/"