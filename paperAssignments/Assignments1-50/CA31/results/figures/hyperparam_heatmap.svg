<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(60,40)">
    <!-- grid placeholder -->
    <g stroke="#ccc">
      <rect x="0" y="0" width="320" height="240" fill="#fff"/>
      <g id="cells">
        <!-- simple gradient blocks -->
        <rect x="0" y="0" width="80" height="60" fill="#fee0d2"/>
        <rect x="80" y="0" width="80" height="60" fill="#fcbba1"/>
        <rect x="160" y="0" width="80" height="60" fill="#fc9272"/>
        <rect x="240" y="0" width="80" height="60" fill="#fb6a4a"/>
        <rect x="0" y="60" width="80" height="60" fill="#fee6ce"/>
        <rect x="80" y="60" width="80" height="60" fill="#fdd49e"/>
        <rect x="160" y="60" width="80" height="60" fill="#fdbb84"/>
        <rect x="240" y="60" width="80" height="60" fill="#fc8d59"/>
        <rect x="0" y="120" width="80" height="60" fill="#fff5eb"/>
        <rect x="80" y="120" width="80" height="60" fill="#fef0d9"/>
        <rect x="160" y="120" width="80" height="60" fill="#fec44f"/>
        <rect x="240" y="120" width="80" height="60" fill="#fe9929"/>
      </g>
    </g>
    <text x="170" y="-10" text-anchor="middle" font-family="sans-serif">Hyperparameter sweep heatmap (placeholder)</text>
