program: scripts/train.py
method: grid
metric:
  name: train/sinkhorn_loss
  goal: minimize
parameters:
  beta:
    values: [0.2, 0.4, 0.6]
  sinkhorn_blur:
    values: [0.005, 0.01, 0.02]
  particles:
    values: [16, 32, 64]
  minibatch_size:
    values: [32, 64]
  use_vector_env:
    values: [false]














