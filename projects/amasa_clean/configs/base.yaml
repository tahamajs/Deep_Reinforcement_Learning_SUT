experiment:
  name: amasa_complex_v2
  mode: offline_train
  seed: 0
  device: cpu
  output_dir: projects/amasa_clean/results
  preset: smoke

env:
  max_steps: 300
  safe_force: 5.0
  safe_corridor: 0.03
  domain_randomization: false

scenario:
  type: nominal
  force_noise_scale: 0.1
  dynamics_shift: 0.0
  obs_corruption_prob: 0.0
  delayed_obs_prob: 0.0

algo:
  name: cql
  lr: 0.0003
  discount: 0.99
  tau: 0.005
  cql_alpha: 5.0
  expectile: 0.7
  beta: 3.0
  alpha: 0.2

safety:
  kp: 0.6
  ki: 0.08
  kd: 0.08
  lambda_max: 10.0
  cost_limit: 0.0
  risk_threshold: 0.65
  shield:
    enabled: true
  risk_critic:
    enabled: true

train:
  steps: 600
  batch_size: 128
  buffer_size: 50000
  eval_every: 200
  save_every: 300
  random_steps: 200
  shield_train_after: 200

eval:
  episodes: 3
  seeds: [0, 1, 2]
  metrics: [reward, cost, success]
  pareto:
    enabled: true
