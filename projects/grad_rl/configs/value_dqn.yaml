# Default hyperparameters for value-based chain
env: "ALE/Breakout-v5"
policy: "CnnPolicy"
num_envs: 4
buffer_size: 100000
learning_rate: 1e-4
batch_size: 32
gamma: 0.99
target_update_interval: 1000
train_freq: 4
learning_starts: 50000
total_steps: 200000
frame_stack: 4
exploration_fraction: 0.1
exploration_final_eps: 0.01
dueling: true
prioritized_replay: false
save_path: "projects/grad_rl/outputs/value_dqn/model.zip"
